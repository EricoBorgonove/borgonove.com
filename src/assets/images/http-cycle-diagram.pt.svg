  <text x="970" y="246" fill="#D7ECFF" font-family="Arial, sans-serif" font-size="20" text-anchor="middle">API / Backend</text>
  <rect x="875" y="278" width="190" height="70" rx="10" fill="#0E172C" stroke="#3E5FA0"/>
  <text x="970" y="305" fill="#D7ECFF" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">Processo:</text>
  <text x="970" y="328" fill="#9FC0E7" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">autent. + regras + dados</text>

  <rect x="445" y="88" width="310" height="120" rx="16" fill="#10203E" stroke="#00C2FF"/>
  <text x="600" y="124" fill="#8EE6FF" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="700">REQUISIÇÃO HTTP</text>
  <text x="470" y="154" fill="#D7ECFF" font-family="Arial, sans-serif" font-size="14">Método: GET / POST / PUT / PATCH / DELETE</text>
  <text x="470" y="176" fill="#D7ECFF" font-family="Arial, sans-serif" font-size="13">Cabeçalhos: Authorization, Content-Type...</text>
  <text x="470" y="198" fill="#D7ECFF" font-family="Arial, sans-serif" font-size="14">Corpo: JSON (opcional)</text>

  <rect x="445" y="308" width="310" height="120" rx="16" fill="#152A1F" stroke="#33D17A"/>
  <text x="600" y="344" fill="#8EF1B7" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" font-weight="700">RESPOSTA HTTP</text>
  <text x="470" y="374" fill="#D7FEE6" font-family="Arial, sans-serif" font-size="14">Código: 2xx / 4xx / 5xx</text>
  <text x="470" y="396" fill="#D7FEE6" font-family="Arial, sans-serif" font-size="13">Cabeçalhos: cache, content-type, cors...</text>
  <text x="470" y="418" fill="#D7FEE6" font-family="Arial, sans-serif" font-size="14">Corpo: dados ou detalhes do erro</text>


<svg width="1200" height="520" viewBox="0 0 1200 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="520" rx="24" fill="#0B1225"/>
  <rect x="70" y="130" width="320" height="260" rx="16" fill="#111C34" stroke="#2E4E8A"/>
  <text x="230" y="180" fill="#8EE6FF" font-family="Arial, sans-serif" font-size="26" text-anchor="middle" font-weight="700">CLIENTE</text>
  <rect x="135" y="215" width="190" height="48" rx="10" fill="#0E172C" stroke="#3E5FA0"/>
  <text x="230" y="246" fill="#D7ECFF" font-family="Arial, sans-serif" font-size="20" text-anchor="middle">Navegador / App</text>
  <rect x="135" y="278" width="190" height="70" rx="10" fill="#0E172C" stroke="#3E5FA0"/>
  <text x="230" y="305" fill="#D7ECFF" font-family="Arial, sans-serif" font-size="16" text-anchor="middle">Ação:</text>
  <text x="230" y="328" fill="#9FC0E7" font-family="Arial, sans-serif" font-size="15" text-anchor="middle">clique / envio / fetch()</text>

  <rect x="810" y="130" width="320" height="260" rx="16" fill="#111C34" stroke="#2E4E8A"/>
  <text x="970" y="180" fill="#8EE6FF" font-family="Arial, sans-serif" font-size="26" text-anchor="middle" font-weight="700">SERVIDOR</text>

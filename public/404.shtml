<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title id="page-title">404 | Página não encontrada</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        background:
          radial-gradient(circle at 30% 30%, rgba(34, 211, 238, 0.16), transparent 40%),
          radial-gradient(circle at 70% 70%, rgba(16, 185, 129, 0.12), transparent 42%),
          linear-gradient(rgba(6, 11, 30, 0.95), rgba(7, 12, 28, 0.98));
        color: #e2e8f0;
        padding: 24px;
      }
      .card {
        width: min(560px, 100%);
        background: rgba(15, 23, 42, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 18px;
        backdrop-filter: blur(10px);
        padding: 28px;
        text-align: center;
      }
      .tag {
        margin: 0 0 12px;
        color: #22d3ee;
        font-size: 0.8rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0 0 10px;
        font-size: clamp(1.8rem, 4vw, 2.5rem);
      }
      p {
        margin: 0;
        color: #94a3b8;
        line-height: 1.6;
      }
      .actions {
        margin-top: 22px;
        display: flex;
        justify-content: center;
      }
      a {
        text-decoration: none;
        background: #22d3ee;
        color: #0f172a;
        font-weight: 700;
        padding: 10px 18px;
        border-radius: 10px;
      }
      a:hover {
        background: #67e8f9;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <p class="tag" id="error-tag">Erro 404</p>
      <h1 id="error-title">Página não encontrada</h1>
      <p id="error-description">O endereço acessado não existe ou foi movido.</p>
      <div class="actions">
        <a id="back-link" href="/">Voltar para início</a>
      </div>
    </main>
    <script>
      (function () {
        var lang = (navigator.language || "").toLowerCase();
        var isEnglish = lang.indexOf("en") === 0;
        if (!isEnglish) return;

        document.documentElement.lang = "en";
        document.title = "404 | Page not found";
        var tag = document.getElementById("error-tag");
        var title = document.getElementById("error-title");
        var description = document.getElementById("error-description");
        var back = document.getElementById("back-link");
        if (tag) tag.textContent = "Error 404";
        if (title) title.textContent = "Page not found";
        if (description) description.textContent = "The requested address does not exist or has been moved.";
        if (back) back.textContent = "Back to home";
      })();
    </script>
  </body>
</html>
